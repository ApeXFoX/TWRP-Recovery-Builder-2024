name: Kryptex TWRP Builder - natrium Bypass

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kryptex Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Cleanup & Environment Setup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare Build Tools
      run: |
        sudo apt update && sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libtinfo5 libgflags-dev python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize & Sync Repo
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Kryptex_Architect"
        git config --global user.email "architect@kryptex.unit"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone https://github.com/TeamWin/android_device_xiaomi_natrium.git ./device/xiaomi/natrium

    - name: Apply Kryptex Bypass Patches
      run: |
        cd workspace/device/xiaomi/natrium
        
        # 1. LEGACY INHERITANCE BYPASS (AOSP 12.1 Crash Fix)
        # embedded.mk kalıntısını modern core_minimal.mk ile değiştir
        sed -i 's|build/target/product/embedded.mk|build/target/product/core_minimal.mk|g' omni_natrium.mk
        
        # Gereksiz uyarı veren eski vendor scriptini imha et
        rm -f vendorsetup.sh

        # 2. SPL MISMATCH (Downgrade) HATASINI KIRMAK İÇİN TARİH MANİPÜLASYONU
        sed -i 's/PLATFORM_SECURITY_PATCH := .*/PLATFORM_SECURITY_PATCH := 2099-12-31/g' BoardConfig.mk
        
        if ! grep -q "PLATFORM_SECURITY_PATCH" BoardConfig.mk; then
          echo "PLATFORM_SECURITY_PATCH := 2099-12-31" >> BoardConfig.mk
        fi

        # 3. ANDROİD 13 FBE v2 VE METADATA ŞİFRELEME ANAHTARLARINI ENJEKTE ET
        {
          echo ""
          echo "# KRYPTEX ENCRYPTION BYPASS"
          echo "TW_INCLUDE_CRYPTO := true"
          echo "TW_INCLUDE_CRYPTO_FBE := true"
          echo "TW_INCLUDE_FBE_METADATA_DECRYPT := true"
          echo "BOARD_USES_METADATA_PARTITION := true"
          echo "PLATFORM_VERSION := 13"
          echo "PLATFORM_SDK_VERSION := 33"
          echo "TW_NO_BIND_SYSTEM := true"
        } >> BoardConfig.mk
        
        echo "LOGICAL_ANALYSIS: Legacy dependencies destroyed. Injection complete."

    - name: Building Recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_natrium-eng
        make clean && make recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: workspace/out/target/product/natrium/recovery.img
        name: Kryptex-Bypass-TWRP-natrium
        tag_name: ${{ github.run_id }}
        body: |
          Kryptex Strategic Unit - natrium Custom Build
          - Target: crDroid Android 13
          - SPL Bypass: 2099-12-31
          - Decryption: FBE v2 / Metadata Enabled
          - Base: AOSP 12.1 (Legacy Inheritance Patched)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
